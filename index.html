<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miss you...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Start Screen Overlay */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50; 
        }

        #start-btn {
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 32px;
            padding: 15px 40px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 400px;
            width: 100%;
            z-index: 1;
            display: none; /* Hidden until start button is clicked */
        }

        .sfml-window {
            position: relative;
            width: 100%;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 25px;
        }

        .title-bar {
            background-color: #f3f3f3;
            color: #333333;
            text-align: center;
            padding: 6px 0;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            border-bottom: 1px solid #ddd;
        }

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        .handwritten-text {
            color: #ffffff;
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 36px;
            text-align: center;
            width: 100%;
            line-height: 1.4;
            padding: 10px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        .handwritten-text:focus {
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 6px;
        }

        .buttons-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 60px;
        }

        .action-btn {
            font-family: 'Caveat', cursive, sans-serif;
            font-size: 28px;
            padding: 8px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        #btn-yes {
            background-color: #ffffff;
            color: #000000;
        }

        #btn-no {
            background-color: #333333;
            color: #ffffff;
            transition: left 0.2s ease, top 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- Initial Start Screen -->
    <div id="start-screen">
        <button id="start-btn">Click to Open</button>
    </div>

    <div class="main-container" id="main-content">
        <div class="sfml-window">
            <div class="title-bar">I miss you...</div>
            <div class="video-container">
                <!-- Removed autoplay and muted. Video plays via JavaScript -->
                <video id="main-video" src="i miss you.mp4" loop playsinline></video>
            </div>
        </div>

        <div class="handwritten-text" contenteditable="true">
            Do you forgive me?
        </div>

        <div class="buttons-container">
            <button class="action-btn" id="btn-yes">Yes</button>
            <button class="action-btn" id="btn-no">No</button>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const mainContent = document.getElementById('main-content');
        const video = document.getElementById('main-video');
        
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');

        // Handle the Start button click
        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            mainContent.style.display = 'flex';
            video.play(); // Video now plays with sound safely
        });

        // Function to move the 'No' button
        function moveButton() {
            btnNo.style.position = 'fixed';
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;

            const randomX = Math.floor(Math.random() * (windowWidth - btnWidth));
            const randomY = Math.floor(Math.random() * (windowHeight - btnHeight));

            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        }

        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', moveButton);

        btnYes.addEventListener('click', () => {
            alert("Yay! ❤️");
        });
    </script>
</body>
</html>
